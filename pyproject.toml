[project]
name = "ableton-mcp-v1"
version = "0.1.1"
description = "V1-focused reliability fork of Ableton MCP: atomic clip writing, drum-pad mapping, bulk session snapshots, structured results, and honest export tooling for AI-assisted music creation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Jason Poindexter", email = "jason@theft.studio"},
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
maintainers = [
    {name = "Jason Poindexter", email = "jason@theft.studio"}
]
license = {text = "MIT"}
keywords = [
    "ableton",
    "music",
    "production",
    "ai",
    "mcp",
    "ollama",
    "claude",
    "midi",
    "daw",
    "live"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Upper bound is load-bearing: mcp 2.x renamed FastMCP to MCPServer, so
    # server.py's `from mcp.server.fastmcp import FastMCP` fails on import.
    # Without it, uvx resolves 2.x and the server dies at startup.
    "mcp[cli]>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
rest = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]
all = [
    "ableton-mcp-v1[rest]",
]

[project.scripts]
ableton-mcp-v1 = "MCP_Server.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server"]

[project.urls]
"Homepage" = "https://github.com/jpoindexter/ableton-mcp"
"Documentation" = "https://github.com/jpoindexter/ableton-mcp#readme"
"Bug Tracker" = "https://github.com/jpoindexter/ableton-mcp/issues"
"Changelog" = "https://github.com/jpoindexter/ableton-mcp/blob/main/CHANGELOG.md"